# Grafana datasource provisioning. Loaded at container start-up.
# UIDs are referenced from the dashboard JSONs in ops/grafana/dashboards.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
      httpMethod: POST

  - name: Jaeger
    type: jaeger
    uid: jaeger
    access: proxy
    url: http://jaeger:16686
    editable: false
    jsonData:
      tracesToMetrics:
        datasourceUid: prometheus
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: -1m
        spanEndTimeShift: 1m
        filterByTraceID: true
        tags: [{ key: "service.name", value: "service" }]
      nodeGraph:
        enabled: true

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      # Click-through from a log line's traceId straight into Jaeger. The
      # double-dollar escapes Grafana's own provisioning env-var interpolation
      # so the literal ${__value.raw} reaches the datasource definition.
      derivedFields:
        - name: TraceID
          datasourceUid: jaeger
          matcherRegex: '"traceId":"([a-f0-9]+)"'
          url: "$${__value.raw}"
          urlDisplayLabel: "View trace"
