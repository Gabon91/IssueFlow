# Prometheus scrape config for the local Compose stack. Two scrape targets:
#   1. issueflow              — Spring Boot Actuator's /actuator/prometheus
#   2. otel-collector         — OTLP-pushed metrics re-exposed on :8889
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: issueflow-local
    environment: dev

scrape_configs:
  - job_name: issueflow
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["issueflow:8080"]
        labels:
          service: issueflow

  - job_name: otel-collector
    metrics_path: /metrics
    static_configs:
      - targets: ["otel-collector:8889"]
        labels:
          service: otel-collector

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
