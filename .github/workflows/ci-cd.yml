name: CI/CD

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "21"
  JAVA_DISTRO: temurin
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/issueflow

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  # -------------------------------------------------------------------------
  # 1. Build, lint, unit + integration tests, JaCoCo coverage report.
  # -------------------------------------------------------------------------
  build-test:
    name: Build · Lint · Test · Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Spotless ratchet mode needs the base branch in the local clone.
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRO }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Lint (Spotless · ratchet vs origin/main)
        run: ./mvnw -B -ntp spotless:check -Dspotless.ratchetFrom=origin/main

      - name: Build + unit & integration tests + JaCoCo report
        run: ./mvnw -B -ntp verify

      - name: Publish test results
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: "**/target/*-reports/TEST-*.xml"
          check_name: "JUnit"
          fail_on_failure: true

      - name: Coverage summary
        if: always()
        run: |
          if [ -f target/site/jacoco/jacoco.csv ]; then
            awk -F',' 'NR>1 {miss+=$4; covered+=$5} END {
              total=miss+covered;
              if (total>0) printf "Line coverage: **%.2f%%** (%d/%d)\n", covered/total*100, covered, total;
            }' target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          retention-days: 7

      - name: Cache built jar for downstream jobs
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/issueflow-*.jar
          if-no-files-found: error
          retention-days: 1

  # -------------------------------------------------------------------------
  # 2. Filesystem & dependency vulnerability scan (Trivy).
  # -------------------------------------------------------------------------
  security-scan:
    name: Security · Trivy (filesystem)
    runs-on: ubuntu-latest
    needs: build-test
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"           # report-only on PRs; flip to "1" to enforce
          format: sarif
          output: trivy-fs.sarif

      - name: Upload SARIF (filesystem)
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  # -------------------------------------------------------------------------
  # 3. Build the OCI image with the Spring Boot Maven plugin (Paketo
  #    buildpacks — no Dockerfile), scan it with Trivy, then push to GHCR
  #    on main / feature/** (skipped on pull_request from forks).
  # -------------------------------------------------------------------------
  docker-build-push:
    name: Docker · Build · Scan · Push (GHCR)
    runs-on: ubuntu-latest
    needs: [build-test, security-scan]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRO }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build image with Spring Boot Maven plugin
        id: build
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          # GHCR requires the owner segment to be lowercase.
          IMG="${REGISTRY}/${IMAGE_NAME,,}:sha-${SHORT_SHA}"
          echo "IMG=${IMG}" >> "$GITHUB_ENV"
          ./mvnw -B -ntp -DskipTests spring-boot:build-image \
            -Dspring-boot.build-image.imageName="${IMG}"

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMG }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"           # report-only; flip to "1" to gate releases
          format: sarif
          output: trivy-image.sarif

      - name: Upload SARIF (image)
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      - name: Save image as workflow artifact (fallback when not pushing)
        if: github.event_name == 'pull_request'
        run: |
          docker save "${IMG}" | gzip > issueflow-image.tar.gz

      - name: Upload image tarball
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: issueflow-docker-image
          path: issueflow-image.tar.gz
          retention-days: 7

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image (+ extra tags from metadata)
        if: github.event_name != 'pull_request'
        run: |
          # Push the primary sha-tagged image we built.
          docker push "${IMG}"
          # Apply and push every additional tag computed by docker/metadata-action.
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            [ "$tag" = "${IMG}" ] && continue
            docker tag "${IMG}" "$tag"
            docker push "$tag"
          done <<< "${{ steps.meta.outputs.tags }}"
