server:
  port: 8080

spring:
  application:
    name: issueflow
  datasource:
    url: jdbc:postgresql://localhost:5432/issueflow
    username: issueflow
    password: issueflow
    driverClassName: org.postgresql.Driver
    platform: postgres
  jpa:
    database: POSTGRESQL
    show-sql: true
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# Stateless JWT auth. Secret MUST be overridden via env in production (>=32 bytes for HS256).
issueflow:
  security:
    jwt:
      secret: ${ISSUEFLOW_JWT_SECRET:change-me-please-change-me-please-32b!}
      issuer: issueflow
      audience: issueflow-api
      expiration-seconds: 3600
  escalation:
    interval: PT5M
    initial-delay: PT1M
    batch-size: 100

# Phase 4 observability. Actuator exposes Kubernetes probes (liveness/readiness),
# Prometheus scrape endpoint, and standard /info + /metrics. Micrometer tracing
# populates trace_id/span_id in MDC for log correlation; sampling is 1.0 in dev
# so every request gets a trace context, override via env in prod if needed.
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
      group:
        readiness:
          include: db, diskSpace
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  info:
    env:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
  metrics:
    tags:
      application: ${spring.application.name}

info:
  app:
    name: ${spring.application.name}
    description: IssueFlow ticket-tracking backend
