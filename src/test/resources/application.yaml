server:
  port: 8080

spring:
  application:
    name: issueflow
  datasource:
    url: jdbc:h2:mem:db;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: password
    driverClassName: org.h2.Driver
  h2:
    console:
      enabled: true
  jpa:
    database: POSTGRESQL
    show-sql: true
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

issueflow:
  security:
    jwt:
      secret: test-secret-test-secret-test-secret-32b!
      issuer: issueflow
      audience: issueflow-api
      expiration-seconds: 3600
  escalation:
    interval: PT1H
    initial-delay: PT1H
    batch-size: 100
