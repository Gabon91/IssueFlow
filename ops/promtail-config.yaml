# Promtail tails Docker container logs and ships them to Loki. We rely on the
# docker_sd_configs discovery so labels are populated from container metadata
# (compose service name, image, etc.) without hard-coding any container IDs.
#
# IssueFlow emits Logback JSON (see src/main/resources/logback-spring.xml), so
# the pipeline drills one layer into Docker's outer JSON envelope, then parses
# the application's structured payload to surface level/logger/traceId.
server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: "container"
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: "stream"
      - source_labels:
          ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: "service"
      - source_labels:
          ["__meta_docker_container_label_com_docker_compose_project"]
        target_label: "compose_project"
    pipeline_stages:
      # Docker wraps each line in {"log":"...","stream":"...","time":"..."}.
      - json:
          expressions:
            output: log
            stream: stream
            timestamp: time
      - timestamp:
          source: timestamp
          format: RFC3339Nano
      - output:
          source: output
      # Logback JSON envelope from issueflow. Other services (postgres, jaeger,
      # prometheus, ...) emit plain text and will simply skip these stages.
      # The stored line stays as the raw Logback JSON so Grafana's derived
      # fields can extract traceId from it and link to Jaeger.
      - match:
          selector: '{service="issueflow"}'
          stages:
            - json:
                expressions:
                  level: level
                  application: application
            - labels:
                level:
                application:
