name: CI/CD

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "21"
  JAVA_DISTRO: temurin
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/issueflow

permissions:
  contents: read
  packages: write
  security-events: write
  # PR feedback surface: coverage / test-failure / docker-summary comments,
  # plus Spotless suggestions posted as inline review comments.
  pull-requests: write
  # Lets mikepenz/action-junit-report own the "JUnit" check run cleanly
  # instead of falling back to logging-only mode.
  checks: write

jobs:
  # -------------------------------------------------------------------------
  # 1. Build, lint, unit + integration tests, JaCoCo coverage report.
  # -------------------------------------------------------------------------
  build-test:
    name: Build · Lint · Test · Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Spotless ratchet mode needs the base branch in the local clone.
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRO }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      # Spotless flow: apply locally (ratchet-limited to changed lines), let
      # reviewdog publish each hunk as an inline PR suggestion on Files
      # Changed, then fail the build if the working tree is dirty. Net effect
      # matches the previous `spotless:check` gate but gives developers a
      # click-to-apply fix inside the PR review.
      - name: Lint (Spotless · apply, ratchet vs origin/main)
        run: ./mvnw -B -ntp spotless:apply -Dspotless.ratchetFrom=origin/main

      - name: Spotless · post diff as PR suggestions
        if: github.event_name == 'pull_request'
        uses: reviewdog/action-suggester@v1
        with:
          tool_name: spotless
          level: warning
          fail_on_error: false

      - name: Spotless · fail on style drift
        run: |
          if ! git diff --quiet; then
            echo "::error::Spotless found style violations on changed lines. Run './mvnw spotless:apply -Dspotless.ratchetFrom=origin/main' locally, or accept the suggestions on the PR."
            git --no-pager diff --stat
            exit 1
          fi

      - name: Build + unit & integration tests + JaCoCo report
        run: ./mvnw -B -ntp verify

      - name: Publish test results
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: "**/target/*-reports/TEST-*.xml"
          check_name: "JUnit"
          fail_on_failure: true
          # Sticky PR comment listing only failed tests + stack traces, so the
          # diff between runs stays readable and green PRs don't get a noisy
          # "all 312 tests passed" wall of text.
          comment: true
          updateComment: true
          detailed_summary: true
          include_passed: false

      - name: Coverage summary
        if: always()
        run: |
          if [ -f target/site/jacoco/jacoco.csv ]; then
            awk -F',' 'NR>1 {miss+=$4; covered+=$5} END {
              total=miss+covered;
              if (total>0) printf "Line coverage: **%.2f%%** (%d/%d)\n", covered/total*100, covered, total;
            }' target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"
          fi

      # Sticky PR comment: overall coverage + per-changed-file deltas. Reads
      # the XML report produced by jacoco:report (bound to verify in pom.xml).
      # Thresholds are advisory (min-coverage-* do not fail the build) so the
      # build-test job's own quality gate remains the single source of truth.
      - name: Post JaCoCo coverage to PR
        if: github.event_name == 'pull_request' && always()
        uses: madrapps/jacoco-report@v1.7.1
        with:
          paths: target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "JaCoCo Coverage"
          update-comment: true
          min-coverage-overall: 60
          min-coverage-changed-files: 70

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          retention-days: 7

      - name: Cache built jar for downstream jobs
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/issueflow-*.jar
          if-no-files-found: error
          retention-days: 1

  # -------------------------------------------------------------------------
  # 2. Filesystem & dependency vulnerability scan (Trivy).
  # -------------------------------------------------------------------------
  security-scan:
    name: Security · Trivy (filesystem)
    runs-on: ubuntu-latest
    needs: build-test
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"           # report-only on PRs; flip to "1" to enforce
          format: sarif
          output: trivy-fs.sarif

      - name: Upload SARIF (filesystem)
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  # -------------------------------------------------------------------------
  # 3. Build the OCI image with the Spring Boot Maven plugin (Paketo
  #    buildpacks — no Dockerfile) and scan it with Trivy on every event.
  #    The push to GHCR is strictly gated on `github.event_name != 'pull_request'`
  #    AND a defensive runtime assertion inside the push step itself, so PRs
  #    (including from forks, where GITHUB_TOKEN has no `packages: write`
  #    anyway) only ever build & scan — never publish.
  # -------------------------------------------------------------------------
  docker-build-push:
    name: Docker · Build · Scan · Push (GHCR)
    runs-on: ubuntu-latest
    needs: [build-test, security-scan]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRO }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build image with Spring Boot Maven plugin
        id: build
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          # GHCR requires the owner segment to be lowercase.
          IMG="${REGISTRY}/${IMAGE_NAME,,}:sha-${SHORT_SHA}"
          echo "IMG=${IMG}" >> "$GITHUB_ENV"
          # The pom binds the image name to the `image.name` Maven property
          # (see <image><name>${image.name}</name></image>), so override that
          # rather than the generic spring-boot.build-image.imageName flag,
          # which an explicit <configuration> block silently ignores.
          ./mvnw -B -ntp -DskipTests spring-boot:build-image \
            -Dimage.name="${IMG}"

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMG }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"           # report-only; flip to "1" to gate releases
          format: sarif
          output: trivy-image.sarif

      - name: Upload SARIF (image)
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      # --- PR-only branch: validate, no publish -----------------------------
      - name: Save image as workflow artifact (PR only)
        if: github.event_name == 'pull_request'
        run: |
          docker save "${IMG}" | gzip > issueflow-image.tar.gz

      - name: Upload image tarball (PR only)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: issueflow-docker-image
          path: issueflow-image.tar.gz
          retention-days: 7

      - name: Comment Docker build summary on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: docker-build
          message: |
            ### Docker · PR validation (push skipped)

            | Stage | Status |
            |---|---|
            | Build (Paketo `builder-jammy-java-tiny`) | done |
            | Trivy image scan (HIGH/CRITICAL) | report uploaded to **Security → Code scanning** under `trivy-image` |
            | Push to GHCR | **skipped** — pull requests never publish |

            - Local tag built: `${{ env.IMG }}`
            - Pull the image locally from the run artifact `issueflow-docker-image` (7-day retention):
              ```bash
              gh run download ${{ github.run_id }} -n issueflow-docker-image
              docker load < issueflow-image.tar.gz
              ```

      # --- Non-PR branch: log in & push to GHCR -----------------------------
      - name: Log in to GHCR (push events only)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR (push events only)
        if: github.event_name != 'pull_request'
        run: |
          # Defense-in-depth: if the workflow's PR guard above is ever
          # accidentally removed or weakened, this assertion still refuses
          # to publish an unmerged commit.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "::error::Refusing to push from a pull_request event."
            exit 1
          fi
          # Push the primary sha-tagged image we built.
          docker push "${IMG}"
          # Apply and push every additional tag computed by docker/metadata-action.
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            [ "$tag" = "${IMG}" ] && continue
            docker tag "${IMG}" "$tag"
            docker push "$tag"
          done <<< "${{ steps.meta.outputs.tags }}"
